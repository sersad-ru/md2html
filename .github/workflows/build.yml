name: Build standalone binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  # Set this once per repo — must match the root .py script's base name
  # (without the .py extension). Deliberately explicit rather than derived
  # from the repo name: repo names and script names don't always match
  # (e.g. esp32-partitions), and this keeps that mapping visible instead
  # of implicit.
  PROJECT_NAME: md2html

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_suffix: linux-x64
            ext: ''
          - os: windows-latest
            os_suffix: windows-x64
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --onefile --name ${{ env.PROJECT_NAME }}-${{ matrix.os_suffix }} ${{ env.PROJECT_NAME }}.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.os_suffix }}
          path: dist/${{ env.PROJECT_NAME }}-${{ matrix.os_suffix }}${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ env.PROJECT_NAME }}-linux-x64/${{ env.PROJECT_NAME }}-linux-x64
            artifacts/${{ env.PROJECT_NAME }}-windows-x64/${{ env.PROJECT_NAME }}-windows-x64.exe
